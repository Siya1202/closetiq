[build]
  # Point Railway to the API's Dockerfile.
  # Build context is the repo root so Dockerfile can access all workspace packages.
  dockerfilePath = "apps/api/Dockerfile"
  watchPatterns = ["apps/api/**", "packages/**"]

[deploy]
  # Health check — Railway uses this to confirm the container is healthy before routing traffic.
  healthcheckPath = "/api/health"
  healthcheckTimeout = 60

  # How many seconds Railway waits before killing the old instance after a new one is healthy.
  drainSeconds = 10

  # Restart policy on crash
  restartPolicyType = "on_failure"
  restartPolicyMaxRetries = 3
